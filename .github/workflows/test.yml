name: Java verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests and quality gates
        run: ./mvnw -B verify

  mutation:
    runs-on: ubuntu-24.04
    env:
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run mutation testing quality gate
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage

  container:
    runs-on: ubuntu-24.04
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nss:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image metadata
        run: docker image inspect nss:ci-${{ github.sha }}
