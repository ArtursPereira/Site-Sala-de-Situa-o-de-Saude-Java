name: Java verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LXdpdGgtc3VmZmljaWVudC1sZW5ndGg=
      SPRING_DATA_REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/checkout@v4
        with:
          repository: Zadoque/NSS-database
          ref: b3b49f6a3700d693d79eedf003eedb0517631c7f
          path: nss-database-contract
      - name: Run tests and quality gates
        run: ./mvnw -B verify -Dnss.database.root=nss-database-contract

  mutation:
    runs-on: ubuntu-24.04
    env:
      JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LXdpdGgtc3VmZmljaWVudC1sZW5ndGg=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run mutation testing quality gate
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage

  container:
    runs-on: ubuntu-24.04
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nss:ci-${{ github.sha }}
      - name: Verify image metadata
        run: docker image inspect nss:ci-${{ github.sha }}
